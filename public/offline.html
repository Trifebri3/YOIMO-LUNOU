<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koneksi Terputus - Yoimo Workspace</title>
    <link rel="icon" type="image/png" href="/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #f8fafc;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.15);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .mascot-wrap {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(30, 41, 59, 0) 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .mascot-img {
            width: 92px;
            height: 92px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }
        .badge-dot {
            width: 6px;
            height: 6px;
            background: #f43f5e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        h1 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 13px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 14px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5);
            transition: all 0.2s;
        }
        .btn-retry:hover {
            transform: translateY(-1px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.6);
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        }
        .btn-retry:active {
            transform: translateY(1px);
        }
        .tip {
            margin-top: 20px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mascot-wrap">
            <img src="/icons/icon-192x192.png" alt="LUNOU" class="mascot-img">
        </div>

        <div class="badge">
            <span class="badge-dot"></span>
            Mode Offline
        </div>

        <h1>Koneksi Sedang Terputus</h1>
        <p>LUNOU mendeteksi perangkat Anda sedang tidak terhubung ke jaringan internet. Periksa Wi-Fi atau data seluler Anda, lalu muat ulang halaman.</p>

        <button type="button" onclick="window.location.reload()" class="btn-retry">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span>Coba Hubungkan Kembali</span>
        </button>

        <div class="tip">
            Yoimo Workspace akan otomatis tersinkronisasi saat online kembali.
        </div>
    </div>
</body>
</html>
